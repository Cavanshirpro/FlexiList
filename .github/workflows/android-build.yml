name: Build and verify Android artifacts

on:
  workflow_call:
    inputs:
      sign_release:
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      STORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Release contract and wrapper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - name: Validate release metadata and automation
        run: |
          python3 tools/release.py metadata
          python3 -m unittest discover -s tools/tests -v

  fdroid:
    name: F-Droid metadata and store assets
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-fdroid.txt
      - name: Install F-Droid validation tools
        run: python -m pip install -r tools/requirements-fdroid.txt
      - name: Validate recipe with upstream F-Droid tooling
        run: python3 tools/check_fdroid.py --commit "$GITHUB_SHA"

  android:
    name: Android ${{ matrix.flavor }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        flavor: [Full, Fdroid]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: echo "y" | sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, lint and build debug APK
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest :app:lint${{ matrix.flavor }}Debug :app:assemble${{ matrix.flavor }}Debug --stacktrace
      - name: Prepare release signing
        if: inputs.sign_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || {
            echo '::error::Configure KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD repository secrets.'
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flexilist-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/flexilist-release.jks" -storepass:env STORE_PASSWORD -alias "${KEY_ALIAS:-upload}" > /dev/null
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ inputs.sign_release && format('{0}/flexilist-release.jks', runner.temp) || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assemble${{ matrix.flavor }}Release --no-configuration-cache --stacktrace
      - name: Stage and inspect APKs
        env:
          FLAVOR: ${{ matrix.flavor }}
          SIGNED_RELEASE: ${{ inputs.sign_release && 'true' || 'false' }}
        run: python3 tools/release.py stage --flavor "$FLAVOR" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.flavor }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}
          path: dist/${{ matrix.flavor }}/*
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/flexilist-release.jks"
